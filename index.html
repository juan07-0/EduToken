    <!-- Script de máxima compatibilidad para Google Chrome y protección contra extensiones -->
    <script>
      (function() {
        var isChromeExtensionError = function(msg, source, err) {
          var text = (msg || '') + ' ' + (source || '') + ' ' + (err && err.stack ? err.stack : '');
          return text.indexOf('chrome-extension://') !== -1 ||
                 text.indexOf('Cannot set property fetch') !== -1 ||
                 text.indexOf('has only a getter') !== -1;
        };

        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && (
              event.message.indexOf('chrome-extension://') !== -1 ||
              event.message.indexOf('fetch') !== -1 ||
              event.message.indexOf('has only a getter') !== -1
            )) ||
            (event.error && isChromeExtensionError('', '', event.error))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var text = (reason && (reason.stack || reason.message)) ? (reason.stack || reason.message) : String(reason);
          if (text.indexOf('chrome-extension://') !== -1 || text.indexOf('Cannot set property fetch') !== -1 || text.indexOf('has only a getter') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          if (isChromeExtensionError(msg, url, err)) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        try {
          var _rawFetch = window.fetch ? window.fetch.bind(window) : function() {
            return Promise.reject(new Error('Fetch no disponible'));
          };
          var _activeFetch = _rawFetch;

          var descriptor = {
            get: function() {
              return _activeFetch;
            },
            set: function(fn) {
              if (typeof fn === 'function') {
                _activeFetch = fn;
              }
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}

          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'fetch', descriptor);
            }
          } catch (e2) {}
        } catch (e) {}
      })();
    </script>
